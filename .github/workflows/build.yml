name: Build PulseTray

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and publish Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore PulseTray.sln

      - name: Build
        run: dotnet build PulseTray.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/PulseTray.UI/PulseTray.UI.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true --output artifacts/PulseTray

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseTray-win-x64
          path: artifacts/PulseTray
